name: CI

on:
  push:
    branches: [main, master, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # 仓库里不能有写死的 AK / Token（CI 上没有 .env，只查常见写法）
      - run: python ../scripts/check_secrets.py
      - run: python -m ruff check app tests ../scripts
      # 格式只检查不改写；不合格时在 backend/ 下运行 ruff format app tests ../scripts
      - run: python -m ruff format --check app tests ../scripts
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
